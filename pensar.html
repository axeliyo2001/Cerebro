<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pensar">
<meta name="theme-color" content="#edf1f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1318" media="(prefers-color-scheme: dark)">
<title>Cerebro · Pensar</title>
<style>
:root{
  --bg:#edf1f5;--surface:#fbfcfd;--ink:#162029;--muted:#5b6b7b;--line:#cdd6df;
  --accent:#0b6e8a;--on-accent:#ffffff;--danger:#b42318;
  --serif:ui-serif,"New York",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0d1318;--surface:#141c23;--ink:#e6edf3;--muted:#8a9aa8;--line:#26323c;
    --accent:#4fb3d1;--on-accent:#06222b;--danger:#f07167}
}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);
  padding:env(safe-area-inset-top) 20px calc(40px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:baseline;padding:28px 0 12px}
h1{font:600 34px/1.1 var(--serif);margin:0}
a,button.ghost{color:var(--muted);font-size:15px;background:none;border:0;padding:6px 0;text-decoration:none}
button{font:inherit;background:var(--accent);color:var(--on-accent);border:0;border-radius:12px;padding:12px 18px;font-weight:600}
button:disabled{opacity:.5}
label{display:block;font-size:14px;color:var(--muted);margin:14px 0 6px}
input,textarea{width:100%;max-width:100%;font:inherit;color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:12px;padding:12px}
textarea{min-height:110px;resize:vertical}
.status{min-height:1.5em;margin:12px 0 0;font-size:14px;color:var(--muted)}
.status.err{color:var(--danger)}
.turn{padding:18px 0;border-bottom:1px solid var(--line)}
.q{font:600 18px/1.35 var(--serif)}
.a{margin-top:10px;white-space:pre-wrap;word-break:break-word}
.used{margin-top:10px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<main>
<header><h1>Pensar</h1><a href="./">← Cerebro</a></header>

<section id="auth" hidden>
  <p style="color:var(--muted)">Entra con tu cuenta privada.</p>
  <label for="email">Correo</label>
  <input id="email" type="email" autocomplete="username">
  <label for="pass">Contraseña</label>
  <input id="pass" type="password" autocomplete="current-password">
  <p><button id="login">Entrar</button></p>
  <p id="auth-status" class="status err" role="status"></p>
</section>

<section id="app" hidden>
  <label for="question">Pregúntale a tu cerebro</label>
  <textarea id="question" maxlength="2000" placeholder="Ej.: ¿Qué tengo pendiente esta semana?"></textarea>
  <p><button id="ask">Pensar</button></p>
  <p id="ask-status" class="status" role="status"></p>
  <div id="turns"></div>
  <p style="margin-top:32px"><button class="ghost" id="logout">Salir</button></p>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.104.0/dist/umd/supabase.min.js"></script>
<script>
(function () {
  var sb = window.supabase.createClient(
    'https://tuwsaboiqwvkfqyxdbqm.supabase.co',
    'sb_publishable_2FPUNjnPKVOXQH75CYb8DQ_KXTXBopd');
  var $ = function (id) { return document.getElementById(id); };

  function showSession(s) { $('auth').hidden = !!s; $('app').hidden = !s; }
  sb.auth.onAuthStateChange(function (_e, s) { showSession(s); });
  sb.auth.getSession().then(function (r) { showSession(r.data.session); });
  $('login').onclick = function () {
    $('auth-status').textContent = 'Entrando…';
    sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('pass').value })
      .then(function (r) { $('auth-status').textContent = r.error ? 'Correo o contraseña incorrectos.' : ''; });
  };
  $('logout').onclick = function () { sb.auth.signOut(); };

  function setStatus(text, err) { var s = $('ask-status'); s.textContent = text; s.className = 'status' + (err ? ' err' : ''); }

  async function errorText(error) {
    try { var body = await error.context.json(); if (body && body.error) return body.error; } catch (e) {}
    return 'No se pudo pensar ahora. Inténtalo de nuevo.';
  }

  $('ask').onclick = async function () {
    var q = $('question').value.trim();
    if (!q) { setStatus('Escribe una pregunta.', true); return; }
    $('ask').disabled = true;
    setStatus('Pensando… puede tardar unos segundos.');
    var res = await sb.functions.invoke('think', { body: { question: q } });
    $('ask').disabled = false;
    if (res.error) { setStatus(await errorText(res.error), true); return; }
    setStatus('');
    $('question').value = '';

    var d = res.data, turn = document.createElement('div');
    turn.className = 'turn';
    var qe = document.createElement('div'); qe.className = 'q'; qe.textContent = q;
    var ae = document.createElement('div'); ae.className = 'a'; ae.textContent = d.answer;
    var ue = document.createElement('div'); ue.className = 'used';
    var mem = (d.used && d.used.memories) || [];
    ue.textContent = 'Ha usado: ' +
      (mem.length ? mem.map(function (m) { return m.title + ' (' + Math.round(m.similarity * 100) + ' %)'; }).join(', ') : 'ningún recuerdo') +
      ' · ' + (d.used ? d.used.tasks : 0) + ' tareas · ' + (d.used ? d.used.projects : 0) + ' proyectos · ' +
      (d.used ? d.used.decisions : 0) + ' decisiones';
    turn.append(qe, ae, ue);
    $('turns').prepend(turn);
  };
})();
</script>
</body>
</html>
