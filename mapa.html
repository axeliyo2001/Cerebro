<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mapa">
<meta name="theme-color" content="#edf1f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#05080b" media="(prefers-color-scheme: dark)">
<title>Cerebro · Mapa</title>
<style>
:root{
  --bg:#edf1f5;--surface:#fbfcfd;--ink:#162029;--muted:#5b6b7b;--line:#cdd6df;
  --accent:#0b6e8a;--on-accent:#ffffff;--danger:#b42318;--edge:rgba(22,32,41,.18);
  --c-project:#0b6e8a;--c-task:#c2610c;--c-done:#9aa6b2;--c-decision:#7c3aed;
  --serif:ui-serif,"New York",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#05080b;--surface:#11181f;--ink:#e6edf3;--muted:#8a9aa8;--line:#26323c;
    --accent:#4fb3d1;--on-accent:#06222b;--danger:#f07167;--edge:rgba(230,237,243,.16);
    --c-project:#4fb3d1;--c-task:#f2a65a;--c-done:#55616c;--c-decision:#a78bfa}
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);overflow:hidden;
  display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:baseline;
  padding:calc(env(safe-area-inset-top) + 14px) 20px 6px}
h1{font:600 30px/1.1 var(--serif);margin:0}
a{color:var(--muted);font-size:15px;text-decoration:none}
.tools{padding:0 20px 8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:999px;padding:6px 12px;display:inline-flex;gap:6px;align-items:center}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chip.off{opacity:.4}
.slider{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);width:100%}
.slider input{flex:1;min-width:0}
#stats{font-size:13px;color:var(--muted);padding:0 20px 6px}
#wrap{position:relative;flex:1;min-height:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
#detail{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));
  background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;
  max-height:45%;overflow:auto;box-shadow:0 8px 30px rgba(0,0,0,.25)}
#detail .k{font-size:13px;color:var(--muted)}
#detail h2{font:600 19px/1.3 var(--serif);margin:2px 0 0}
#detail p{margin:8px 0 0;white-space:pre-wrap;word-break:break-word}
#detail button{position:absolute;top:8px;right:10px;background:none;border:0;color:var(--muted);font-size:22px;padding:4px 8px}
#auth{padding:20px}
#auth input{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin:6px 0}
#auth button{font:inherit;background:var(--accent);color:var(--on-accent);border:0;border-radius:12px;padding:12px 18px;font-weight:600;margin-top:8px}
.msg{color:var(--muted);font-size:14px;padding:0 20px}
</style>
</head>
<body>
<header><h1>Mapa</h1><a href="./">← Cerebro</a></header>

<section id="auth" hidden>
  <p style="color:var(--muted)">Entra con tu cuenta privada.</p>
  <input id="email" type="email" placeholder="Correo" autocomplete="username">
  <input id="pass" type="password" placeholder="Contraseña" autocomplete="current-password">
  <button id="login">Entrar</button>
  <p id="auth-status" style="color:var(--danger)"></p>
</section>

<div id="tools" class="tools" hidden>
  <button class="chip" data-type="memory"><i style="background:#9aa6b2"></i>Recuerdos</button>
  <button class="chip" data-type="project"><i style="background:var(--c-project)"></i>Proyectos</button>
  <button class="chip" data-type="task"><i style="background:var(--c-task)"></i>Tareas</button>
  <button class="chip" data-type="decision"><i style="background:var(--c-decision)"></i>Decisiones</button>
  <label class="slider">Parecido mínimo <input id="sim" type="range" min="25" max="70" step="5" value="40"><span id="simv">40 %</span></label>
</div>
<div id="stats"></div>
<p id="msg" class="msg"></p>
<div id="wrap" hidden>
  <canvas id="c"></canvas>
  <div id="detail" hidden><button id="close" aria-label="Cerrar">×</button><div id="detail-body"></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.104.0/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>
(function () {
  var sb = window.supabase.createClient(
    'https://tuwsaboiqwvkfqyxdbqm.supabase.co',
    'sb_publishable_2FPUNjnPKVOXQH75CYb8DQ_KXTXBopd');
  var $ = function (id) { return document.getElementById(id); };
  var css = function (v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); };
  var PALETTE = ['#e5484d', '#f2a65a', '#e2c044', '#46a758', '#12a594', '#3e9ce5', '#8e7cf0', '#d6409f', '#9aa6b2'];
  var TYPE = { memory: 'Recuerdo', project: 'Proyecto', task: 'Tarea', decision: 'Decisión' };
  var hidden = {};
  var data = null, sim = null, transform = d3.zoomIdentity, canvas = $('c'), ctx = canvas.getContext('2d');
  var nodes = [], links = [], selected = null, started = false;

  function catColor(cat) {
    var h = 0; cat = cat || 'general';
    for (var i = 0; i < cat.length; i++) h = (h * 31 + cat.charCodeAt(i)) >>> 0;
    return PALETTE[h % PALETTE.length];
  }

  // ---------- sesión
  function showSession(s) {
    $('auth').hidden = !!s; $('tools').hidden = !s; $('wrap').hidden = !s;
    if (s && !started) { started = true; load(); }
    if (!s) started = false;
  }
  sb.auth.onAuthStateChange(function (_e, s) { showSession(s); });
  sb.auth.getSession().then(function (r) { showSession(r.data.session); });
  $('login').onclick = function () {
    $('auth-status').textContent = 'Entrando…';
    sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('pass').value })
      .then(function (r) { $('auth-status').textContent = r.error ? 'Correo o contraseña incorrectos.' : ''; });
  };

  // ---------- datos
  async function load() {
    $('msg').textContent = 'Dibujando tu cerebro…';
    var r = await Promise.all([
      sb.from('memories').select('id,title,content,category,project_id,created_at').limit(2000),
      sb.from('projects').select('id,name,description,status,created_at').limit(500),
      sb.from('tasks').select('id,title,notes,status,priority,due_date,project_id').limit(1000),
      sb.from('decisions').select('id,title,decision,rationale,status,decided_at,project_id').limit(1000)
    ]);
    if (r.some(function (x) { return x.error; })) { $('msg').textContent = 'No se pudieron cargar los datos.'; return; }
    data = { memories: r[0].data, projects: r[1].data, tasks: r[2].data, decisions: r[3].data, sims: [] };
    await loadSims();
  }
  async function loadSims() {
    var min = Number($('sim').value) / 100;
    var r = await sb.rpc('memory_links', { min_similarity: min, per_node: 3 });
    data.sims = r.error ? [] : (r.data || []);
    $('msg').textContent = r.error ? 'No se pudieron calcular las conexiones por significado.' : '';
    build();
  }

  function build() {
    var old = {}; nodes.forEach(function (n) { old[n.id] = n; });
    var N = [], L = [], byId = {};
    function add(n) { var o = old[n.id]; if (o) { n.x = o.x; n.y = o.y; n.vx = o.vx; n.vy = o.vy; } N.push(n); byId[n.id] = n; }
    if (!hidden.project) data.projects.forEach(function (p) {
      add({ id: p.id, type: 'project', title: p.name, body: p.description, meta: 'Estado: ' + p.status, color: css('--c-project'), r: 10 });
    });
    if (!hidden.memory) data.memories.forEach(function (m) {
      add({ id: m.id, type: 'memory', title: m.title, body: m.content, meta: 'Categoría: ' + m.category, color: catColor(m.category), r: 5, project: m.project_id });
    });
    if (!hidden.task) data.tasks.forEach(function (t) {
      var done = t.status === 'done' || t.status === 'cancelled';
      add({ id: t.id, type: 'task', title: t.title, body: t.notes, meta: 'Estado: ' + t.status + ' · prioridad ' + t.priority + (t.due_date ? ' · fecha ' + t.due_date : ''),
        color: done ? css('--c-done') : css('--c-task'), r: t.priority === 'high' ? 6 : 4, project: t.project_id });
    });
    if (!hidden.decision) data.decisions.forEach(function (d) {
      add({ id: d.id, type: 'decision', title: d.title, body: d.decision + (d.rationale ? '\n\nPorque: ' + d.rationale : ''), meta: 'Estado: ' + d.status,
        color: css('--c-decision'), r: 5, project: d.project_id });
    });
    N.forEach(function (n) { if (n.project && byId[n.project]) L.push({ source: n.id, target: n.project, kind: 'project' }); });
    if (!hidden.memory) data.sims.forEach(function (s) {
      if (byId[s.source] && byId[s.target]) L.push({ source: s.source, target: s.target, kind: 'sim', w: s.similarity });
    });
    var deg = {}; L.forEach(function (l) { deg[l.source] = (deg[l.source] || 0) + 1; deg[l.target] = (deg[l.target] || 0) + 1; });
    N.forEach(function (n) { n.r = n.r + Math.min(6, Math.sqrt(deg[n.id] || 0) * 1.2); });
    nodes = N; links = L;

    var c = data.memories.length + ' recuerdos · ' + data.projects.length + ' proyectos · ' + data.tasks.length + ' tareas · ' +
      data.decisions.length + ' decisiones · ' + L.length + ' conexiones';
    $('stats').textContent = c;
    if (!N.length) $('msg').textContent = 'Tu mapa está vacío. Guarda recuerdos o crea proyectos y aparecerán aquí.';

    if (sim) sim.stop();
    sim = d3.forceSimulation(nodes)
      .force('link', d3.forceLink(links).id(function (d) { return d.id; })
        .distance(function (l) { return l.kind === 'project' ? 45 : 70; })
        .strength(function (l) { return l.kind === 'project' ? 0.6 : 0.25 + (l.w || 0) * 0.5; }))
      .force('charge', d3.forceManyBody().strength(-60))
      .force('x', d3.forceX(0).strength(0.04))
      .force('y', d3.forceY(0).strength(0.04))
      .force('collide', d3.forceCollide(function (d) { return d.r + 3; }))
      .on('tick', draw);
  }

  // ---------- dibujo
  function resize() {
    var dpr = window.devicePixelRatio || 1, w = canvas.clientWidth, h = canvas.clientHeight;
    canvas.width = w * dpr; canvas.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); draw();
  }
  function draw() {
    var w = canvas.clientWidth, h = canvas.clientHeight;
    ctx.save(); ctx.clearRect(0, 0, w, h);
    ctx.translate(w / 2 + transform.x, h / 2 + transform.y); ctx.scale(transform.k, transform.k);
    ctx.lineWidth = 1 / transform.k;
    links.forEach(function (l) {
      if (!l.source.x && l.source.x !== 0) return;
      var on = selected && (l.source === selected || l.target === selected);
      ctx.strokeStyle = on ? css('--accent') : css('--edge');
      ctx.globalAlpha = l.kind === 'sim' ? 0.5 + (l.w || 0) * 0.5 : 0.9;
      ctx.beginPath(); ctx.moveTo(l.source.x, l.source.y); ctx.lineTo(l.target.x, l.target.y); ctx.stroke();
    });
    ctx.globalAlpha = 1;
    nodes.forEach(function (n) {
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
      ctx.fillStyle = n.color; ctx.fill();
      if (n === selected) { ctx.lineWidth = 2.5 / transform.k; ctx.strokeStyle = css('--ink'); ctx.stroke(); ctx.lineWidth = 1 / transform.k; }
    });
    if (transform.k > 1.4 || nodes.length < 40) {
      ctx.fillStyle = css('--muted'); ctx.font = (11 / transform.k) + 'px ' + css('--sans');
      ctx.textAlign = 'center';
      nodes.forEach(function (n) { if (n.type === 'project' || transform.k > 1.4 || nodes.length < 40) ctx.fillText(n.title.slice(0, 28), n.x, n.y + n.r + 12 / transform.k); });
    }
    ctx.restore();
  }

  // ---------- gestos: arrastrar, pellizcar y tocar
  var zoom = d3.zoom().scaleExtent([0.2, 6]).on('zoom', function (e) { transform = e.transform; draw(); });
  d3.select(canvas).call(zoom).on('dblclick.zoom', null);
  canvas.addEventListener('click', function (e) {
    var rect = canvas.getBoundingClientRect();
    var x = (e.clientX - rect.left - rect.width / 2 - transform.x) / transform.k;
    var y = (e.clientY - rect.top - rect.height / 2 - transform.y) / transform.k;
    var best = null, bd = Infinity;
    nodes.forEach(function (n) { var d = Math.hypot(n.x - x, n.y - y); if (d < bd) { bd = d; best = n; } });
    if (best && bd < best.r + 14 / transform.k) select(best); else select(null);
  });
  function select(n) {
    selected = n; draw();
    if (!n) { $('detail').hidden = true; return; }
    var b = $('detail-body'); b.replaceChildren();
    var k = document.createElement('div'); k.className = 'k'; k.textContent = TYPE[n.type] + ' · ' + n.meta;
    var h = document.createElement('h2'); h.textContent = n.title;
    b.append(k, h);
    if (n.body) { var p = document.createElement('p'); p.textContent = n.body; b.appendChild(p); }
    var rel = links.filter(function (l) { return l.source === n || l.target === n; })
      .map(function (l) { var o = l.source === n ? l.target : l.source; return o.title + (l.kind === 'sim' ? ' (' + Math.round(l.w * 100) + ' %)' : ''); });
    if (rel.length) { var q = document.createElement('p'); q.className = 'k'; q.textContent = 'Conectado con: ' + rel.join(', '); b.appendChild(q); }
    $('detail').hidden = false;
  }
  $('close').onclick = function () { select(null); };

  // ---------- filtros
  document.querySelectorAll('.chip').forEach(function (c) {
    c.onclick = function () { var t = c.dataset.type; hidden[t] = !hidden[t]; c.classList.toggle('off', hidden[t]); select(null); if (data) build(); };
  });
  $('sim').oninput = function () { $('simv').textContent = $('sim').value + ' %'; };
  $('sim').onchange = function () { if (data) loadSims(); };

  window.addEventListener('resize', resize);
  new ResizeObserver(resize).observe(canvas);
  if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { if (data) build(); });
})();
</script>
</body>
</html>
